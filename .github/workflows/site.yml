name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt pytest html5lib playwright

      - name: Install Chromium for printing the PDFs
        run: python -m playwright install --with-deps chromium

      - name: Build the site
        run: python -m pipeline.build

      # Pages with `pdf:` in their front matter are printed with the site's own
      # print stylesheet into _site/downloads/.
      - name: Print the downloadable PDFs
        run: python -m pipeline.pdf

      # Every internal link (including the PDFs), image and anchor must resolve,
      # every image needs alt text, HTML must parse strictly, titles and
      # descriptions must fit search results, and the guide must fit 4 pages.
      - name: Check links, accessibility basics and print length
        env:
          GL_SKIP_BUILD: "1"
        run: python -m pytest -q

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
