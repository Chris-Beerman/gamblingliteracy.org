# The three sites. Shown in the footer of every page.
family:
  - name: Gambling Research Index
    url: https://gambling-research.com/
    role: Research
    blurb: New gambling studies, policy and court news, indexed nightly.
    mark: research
  - name: Gambling Literacy
    url: https://gamblingliteracy.org/
    role: Education
    blurb: Gambling education and advocacy for adults who work with young people.
    mark: literacy
  - name: Chicago Addiction Therapy
    url: https://www.chicagoaddictiontherapy.com/
    role: Treatment, adults 18+
    blurb: Chris Beerman's private practice. Treats adults and supports their families; does not treat minors.
    mark: therapy

